<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navbar 5 - Chocolate & Gold</title>
<style>
body { margin:0; font-family:Arial; height:2000px; background:#f2e6d9; }
.navbar {
  position: fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:25px;
  background:#5C3A21; /* chocolate */
  padding:15px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  z-index:1000;
}
.navbar a {
  color:#FFD700; /* gold */
  text-decoration:none;
  font-weight:bold;
  padding:8px 15px;
  transition: 0.3s all;
}
.navbar a:hover {
  background:#FFD700;
  color:#5C3A21;
  border-radius:8px;
}
</style>
</head>
<body>

<nav class="navbar">
  <a href="#">Home</a>
  <a href="#">Portfolio</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</nav>

<div style="margin-top:100px;padding:20px;">
<h1>Chocolate & Gold Navbar</h1>
<p>Luxury styled navbar with chocolate background and gold hover effect.</p>
</div>

</body>
</html>
