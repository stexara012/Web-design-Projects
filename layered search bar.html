<!DOCTYPE html>

<meta charset="UTF-8">

<title>10 Varijacija Layered Search Bara</title>
<style>
body {
    background: #0d0d0f;
    font-family: Arial, sans-serif;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 40px;
    padding: 40px;
    justify-items: center;
    align-items: center;
}

/* KONTEJNER ZA SVAKU VARIJACIJU */
.search-container {
    position: relative;
    width: 400px;
    height: 65px;
}

/* OSNOVNI LAYER */
.search-layer {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    z-index: 1;
}

/* REFLECTION / GLOW LAYER */
.search-layer.reflection {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    backdrop-filter: blur(12px);
    z-index: 2;
}

/* GLASS SEARCH BAR */
.search-bar {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    padding: 0 18px;
    border-radius: 18px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow:
        0 0 15px rgba(0,255,255,0.3),
        0 0 40px rgba(255,0,255,0.1),
        inset 0 0 18px rgba(255,255,255,0.05);
}

/* FLOATING LABEL */
.floating-label {
    position: absolute;
    left: 25px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.5);
    font-size: 16px;
    transition: 0.25s ease;
    pointer-events: none;
}

/* INPUT */
.search-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: #fff;
    font-size: 17px;
    padding: 15px 0;
}

/* ICON */
.search-icon {
    margin-left: 14px;
    padding: 10px 14px;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ICON HOVER */
.search-icon:hover {
    transform: scale(1.15);
}

/* LABEL FOCUS */
.search-input:focus ~ .floating-label,
.search-input:not(:placeholder-shown) ~ .floating-label {
    top: 12px;
    font-size: 12px;
    color: #00ffff;
    opacity: 0.9;
    letter-spacing: 1px;
}

/* FOCUS BAR */
.search-bar:has(.search-input:focus) {
    box-shadow:
        0 0 18px rgba(0,255,255,0.6),
        0 0 50px rgba(0,255,255,0.4),
        inset 0 0 18px rgba(0,255,255,0.2);
    border-color: rgba(0,255,255,0.5);
}

/* PULSE ANIMATION */
@keyframes pulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.03); }
    100% { transform: scale(1); }
}
