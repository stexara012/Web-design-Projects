<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassmorphism Form</title>
<style>
/* Reset */
*{box-sizing:border-box;margin:0;padding:0;font-family:"Poppins", sans-serif;}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#667eea,#764ba2);
}

/* Glass Container */
.container{
    width:400px;
    max-width:95%;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    border-radius:20px;
    padding:40px 30px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    border:1px solid rgba(255,255,255,0.2);
}

/* Header */
.header{
    text-align:center;
    margin-bottom:30px;
}
.header h1{
    color:#fff;
    font-size:28px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
}

/* Form */
.form{
    display:flex;
    flex-direction:column;
    gap:20px;
}
.control-form{
    position:relative;
}
.control-form input{
    width:100%;
    padding:14px 12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.2);
    color:#fff;
    font-size:14px;
    outline:none;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
}
.control-form input::placeholder{
    color:transparent;
}
.control-form input:focus{
    border-color:#fff;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
}

/* Floating Labels */
.control-form label{
    position:absolute;
    top:50%;
    left:12px;
    color:rgba(255,255,255,0.7);
    pointer-events:none;
    transform:translateY(-50%);
    transition:0.2s ease;
    font-size:14px;
}
.control-form input:focus + label,
.control-form input:not(:placeholder-shown) + label{
    top:-8px;
    font-size:12px;
    color:#fff;
    background: rgba(255,255,255,0.1);
    padding:0 4px;
}

/* Error message */
.control-form small{
    color:#ff6b6b;
    font-size:12px;
    position:absolute;
    bottom:-20px;
    left:0;
    visibility:hidden;
    transition: all 0.3s ease;
}
.control-form.fail small{
    visibility:visible;
}

/* Success & Fail */
.control-form.success input{
    border-color:#28a745;
}
.control-form.fail input{
    border-color:#ff6b6b;
}

/* Button */
.form button{
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:600;
    background: linear-gradient(45deg,#667eea,#764ba2);
    color:#fff;
    cursor:pointer;
    transition: all 0.3s ease;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
.form button:hover{
    transform: scale(1.03);
    box-shadow:0 6px 20px rgba(0,0,0,0.3);
}

/* Responsive */
@media(max-width:500px){
    .container{padding:30px 20px;}
}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Sign Up</h1>
    </div>
    <form id="form" class="form">
        <div class="control-form">
            <input type="text" placeholder=" " id="username">
            <label for="username">Username</label>
            <small class="error"></small>
        </div>
        <div class="control-form">
            <input type="email" placeholder=" " id="email">
            <label for="email">Email</label>
            <small class="error"></small>
        </div>
        <div class="control-form">
            <input type="password" placeholder=" " id="password">
            <label for="password">Password</label>
            <small class="error"></small>
        </div>
        <div class="control-form">
            <input type="password" placeholder=" " id="passwordCheck">
            <label for="passwordCheck">Confirm Password</label>
            <small class="error"></small>
        </div>
        <button type="submit">Submit</button>
    </form>
</div>

<script>
// Form validation
const form = document.getElementById("form");
const username = document.getElementById("username");
const email = document.getElementById("email");
const password = document.getElementById("password");
const passwordCheck = document.getElementById("passwordCheck");

form.addEventListener("submit", e=>{
    e.preventDefault();
    checkInputs();
});

function checkInputs(){
    const usernameValue = username.value.trim();
    const emailValue = email.value.trim();
    const passwordValue = password.value.trim();
    const passwordCheckValue = passwordCheck.value.trim();

    if(usernameValue==="") setErrorFor(username,"Username cannot be empty");
    else setSuccessFor(username);

    if(emailValue==="") setErrorFor(email,"Email cannot be empty");
    else if(!isEmail(email)) setErrorFor(email,"Enter a valid email");
    else setSuccessFor(email);

    if(passwordValue==="") setErrorFor(password,"Password cannot be empty");
    else setSuccessFor(password);

    if(passwordCheckValue==="") setErrorFor(passwordCheck,"Confirm your password");
    else if(passwordCheckValue!==passwordValue) setErrorFor(passwordCheck,"Passwords do not match");
    else setSuccessFor(passwordCheck);
}

function setErrorFor(input,message){
    const formControl = input.parentElement;
    const small = formControl.querySelector("small");
    formControl.className="control-form fail";
    small.innerText = message;
}

function setSuccessFor(input){
    const formControl = input.parentElement;
    formControl.className="control-form success";
}

function isEmail(email){
    return /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/.test(email);
}
</script>

</body>
</html>
