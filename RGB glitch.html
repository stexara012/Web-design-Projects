<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ASCII RGB Glitch</title>
<style>
  :root{
    --neon1: rgba(255,0,255,1);
    --neon2: rgba(0,255,255,1);
    --neon3: rgba(0,255,255,1);
  }

  body{
    margin:0;
    background:#050007;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family: monospace;
  }

  #container{
    position:relative;
    transform: scale(0.5); /* 2x size */
  }

  .layer{
    position:absolute;
    top:50%;
    left:50%;
    transform: translate(-50%, -50%);
    white-space: pre;
    line-height:0.6;
    font-size:8px;
  }

  #base{
    color: #fff;
    opacity: 0.95;
  }

  /* RGB GLITCH LAYERS */
  .rgbLayer{
    position:absolute;
    top:50%;
    left:50%;
    transform: translate(-50%, -50%);
    white-space: pre;
    line-height:0.6;
    font-size:8px;
    mix-blend-mode: screen;
    opacity: 0.9;
    pointer-events:none;
  }

  .r{ color: rgba(255,0,0,0.9); }
  .g{ color: rgba(0,255,0,0.9); }
  .b{ color: rgba(0,0,255,0.9); }

  /* UI */
  #ui{
    position:fixed;
    left:10px;
    top:10px;
    color: rgba(255,255,255,0.8);
    font-family: monospace;
    z-index:10;
  }
  #ui div{ margin:6px 0; }

  /* strong glitch animation */
  .glitchAnim{
    animation: glitchMove 0.07s infinite;
  }
  @keyframes glitchMove{
    0% { transform: translate(-50%, -50%) translate(0,0); }
    20% { transform: translate(-50%, -50%) translate(-3px, 2px); }
    40% { transform: translate(-50%, -50%) translate(4px, -2px); }
    60% { transform: translate(-50%, -50%) translate(-5px, -3px); }
    80% { transform: translate(-50%, -50%) translate(3px, 4px); }
    100% { transform: translate(-50%, -50%) translate(0,0); }
  }
</style>
</head>
<body>

<div id="container">
  <div id="base" class="layer"></div>

  <div id="rgbR" class="rgbLayer r"></div>
  <div id="rgbG" class="rgbLayer g"></div>
  <div id="rgbB" class="rgbLayer b"></div>
</div>

<div id="ui">
  <div>Modes: 1 = Glitch Characters | 2 = STRONG RGB Glitch</div>
  <div>Press 1 or 2</div>
</div>

  `;

  function buildGrid(text){
    const lines = text.trim().split("\n");
    const grid = lines.map(l => l.split(""));
    return grid;
  }

  const asciiGrid = buildGrid(ASCII);
  const h = asciiGrid.length;
  const w = Math.max(...asciiGrid.map(r => r.length));

  const baseGrid = Array.from({length: ROWS}, () => Array(COLS).fill(" "));
  const startY = (ROWS/2 - h/2)|0;
  const startX = (COLS/2 - w/2)|0;

  for(let y=0; y<h; y++){
    for(let x=0; x<asciiGrid[y].length; x++){
      baseGrid[startY+y][startX+x] = asciiGrid[y][x];
    }
  }

  const baseEl = document.getElementById("base");
  const rEl = document.getElementById("rgbR");
  const gEl = document.getElementById("rgbG");
  const bEl = document.getElementById("rgbB");

  let mode = 1;

  function randomChar(){
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*";
    return chars[Math.floor(Math.random()*chars.length)];
  }

  function glitchChars(grid, amount=700){
    const g = JSON.parse(JSON.stringify(grid));
    for(let i=0; i<amount; i++){
      const y = Math.floor(Math.random()*ROWS);
      const x = Math.floor(Math.random()*COLS);
      if(g[y][x] !== " ") g[y][x] = randomChar();
    }
    return g;
  }

  function render(el, grid){
    let html = "";
    for(let y=0; y<ROWS; y++){
      for(let x=0; x<COLS; x++){
        html += grid[y][x];
      }
      html += "\n";
    }
    el.textContent = html;
  }

  function loop(){
    render(baseEl, baseGrid);

    if(mode===1){
      const g = glitchChars(baseGrid, 600);
      rEl.classList.remove("glitchAnim");
      gEl.classList.remove("glitchAnim");
      bEl.classList.remove("glitchAnim");
      render(rEl, g);
      render(gEl, g);
      render(bEl, g);
    }

    if(mode===2){
      const g = glitchChars(baseGrid, 1200);

      rEl.classList.add("glitchAnim");
      gEl.classList.add("glitchAnim");
      bEl.classList.add("glitchAnim");

      // strong RGB shift
      rEl.style.transform = "translate(-50%, -50%) translate(-3px, 1px)";
      gEl.style.transform = "translate(-50%, -50%) translate(2px, -2px)";
      bEl.style.transform = "translate(-50%, -50%) translate(5px, 2px)";

      render(rEl, g);
      render(gEl, g);
      render(bEl, g);
    }

    requestAnimationFrame(loop);
  }

  document.addEventListener("keydown", (e)=>{
    if(e.key === "1") mode = 1;
    if(e.key === "2") mode = 2;
  });

  loop();
</script>
